<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員中心</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="member-page">
    <h1>會員中心</h1>

    <section id="profile"></section>

    <section>
      <h2>綁定 LINE 帳號</h2>
      <button id="genCode">產生綁定碼</button>
      <p id="codeResult"></p>
    </section>

    <section>
      <h2>我的群組</h2>
      <div id="groups"></div>
    </section>

    <button id="logout">登出</button>
  </div>

  <script>
    async function loadProfile() {
      const res = await fetch('/api/member/me');
      if (res.status === 401) { window.location.href = '/member-login.html'; return; }
      const data = await res.json();

      document.getElementById('profile').innerHTML = `
        <p>Email：${data.email || ''}</p>
        <p>LINE 綁定狀態：${data.lineLinked ? '✅ 已綁定' : '❌ 尚未綁定'}</p>
        <p>方案狀態：${data.subscription?.status || '無'}（${data.subscription?.plan || ''}）</p>
        <p>本月已用翻譯次數：${data.usage?.translationCount ?? 0} / ${data.subscription?.monthlyQuota || '無限制'}</p>
      `;
    }

    document.getElementById('genCode').onclick = async () => {
      const res = await fetch('/api/member/line-link-code', { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('codeResult').innerText =
          `${data.instruction}（10 分鐘內有效，逾時請重新產生）`;
      } else {
        document.getElementById('codeResult').innerText = data.error || '產生失敗';
      }
    };

    async function loadGroups() {
      const res = await fetch('/api/member/groups');
      const data = await res.json();
      const groups = data.groups || [];

      if (groups.length === 0) {
        document.getElementById('groups').innerHTML = '<p>尚未綁定任何群組，請先完成 LINE 綁定。</p>';
        return;
      }

      document.getElementById('groups').innerHTML = groups.map(g => `
        <div class="group-card">
          <p>群組名稱：${g.groupName || g.gid}</p>
          語言：
          <select onchange="updateGroup('${g.gid}', this.value, document.getElementById('industry_${g.gid}').value)">
            <option value="zh-TW" ${g.langs?.includes('zh-TW') ? 'selected' : ''}>中文</option>
            <option value="en" ${g.langs?.includes('en') ? 'selected' : ''}>英文</option>
            <option value="th" ${g.langs?.includes('th') ? 'selected' : ''}>泰文</option>
            <option value="vi" ${g.langs?.includes('vi') ? 'selected' : ''}>越南文</option>
            <option value="id" ${g.langs?.includes('id') ? 'selected' : ''}>印尼文</option>
          </select>
          行業：
          <select id="industry_${g.gid}" onchange="updateGroup('${g.gid}', document.querySelector('[onchange*=\\'${g.gid}\\']').value, this.value)">
            <option value="" ${!g.industry ? 'selected' : ''}>未指定</option>
            ${(g.industryOptions || []).map(ind =>
              `<option value="${ind}" ${g.industry === ind ? 'selected' : ''}>${ind}</option>`
            ).join('')}
          </select>
        </div>
      `).join('');
    }

    async function updateGroup(gid, lang, industry) {
      await fetch(`/api/member/groups/${gid}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lang, industry })
      });
      loadGroups();
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/api/member/logout', { method: 'POST' });
      window.location.href = '/member-login.html';
    };

    loadProfile();
    loadGroups();
  </script>
</body>
</html>
