<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>會員中心</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="member-shell">
    <aside class="member-sidebar">
      <div class="member-brand">
        <div class="member-brand-icon">🌐</div>
        <div>
          <div class="member-brand-title">TransXAI</div>
          <div class="member-brand-sub">Member Console</div>
        </div>
      </div>

      <nav class="member-nav">
        <a href="#overview" class="member-nav-link active">總覽</a>
        <a href="#binding" class="member-nav-link">LINE 綁定</a>
        <a href="#groups" class="member-nav-link">群組設定</a>
      </nav>

      <div class="member-sidebar-foot">
        <div class="member-foot-box">
          <div class="member-foot-label">系統狀態</div>
          <div class="member-foot-value">Online</div>
        </div>
      </div>
    </aside>

    <main class="member-main">
      <header class="member-topbar">
        <div>
          <div class="member-topbar-title">會員中心</div>
          <div class="member-topbar-sub">管理 LINE 綁定、群組語言與行業設定</div>
        </div>
        <button id="logout" class="btn btn-ghost member-logout" style="display:none;">登出</button>
      </header>

      <div class="member-content">
        <section id="loginSection" class="member-auth-wrap" style="display:none;">
          <div class="member-auth-card">
            <div class="member-auth-badge">PASSWORDLESS LOGIN</div>
            <h1>登入會員中心</h1>
            <p>輸入 Email，我們會寄送一次性登入連結到您的信箱。</p>

            <div class="member-auth-form">
              <label for="email">Email</label>
              <input id="email" class="field member-field" type="email" placeholder="you@example.com" />
              <button id="sendLink" class="btn btn-primary member-auth-btn">寄送登入連結</button>
              <p id="loginMsg" class="member-message"></p>
            </div>
          </div>
        </section>

        <section id="memberSection" style="display:none;">
          <section id="overview" class="panel member-panel">
            <div class="panel-header">
              <h2><span class="ph-icon">📊</span> 帳號總覽</h2>
            </div>
            <div class="member-stats" id="profileStats"></div>
            <div id="profile" class="member-profile-grid"></div>
          </section>

          <section id="binding" class="panel member-panel">
            <div class="panel-header">
              <h2><span class="ph-icon">🔗</span> LINE 帳號綁定</h2>
            </div>

            <div class="member-bind-card">
              <div class="member-bind-text">
                <div class="member-bind-title">產生專屬綁定碼</div>
                <p>點擊按鈕後，請到 LINE 官方帳號的一對一聊天視窗傳送「綁定 XXXXXXXXXX」。</p>
              </div>
              <div class="member-bind-actions">
                <button id="genCode" class="btn btn-primary">產生綁定碼</button>
              </div>
            </div>

            <div id="codeResult" class="member-code-box"></div>
          </section>

          <section id="groups" class="panel member-panel">
            <div class="panel-header">
              <h2><span class="ph-icon">🧩</span> 群組設定</h2>
            </div>
            <div id="groupsMeta" class="member-groups-meta"></div>
            <div id="groups" class="member-groups-grid"></div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "__FIREBASE_WEB_API_KEY__",
      authDomain: "__FIREBASE_AUTH_DOMAIN__"
    });

    const LANG_LABELS = {
      "zh-TW": "繁中",
      "en": "英文",
      "th": "泰文",
      "vi": "越文",
      "id": "印尼文"
    };

    let cachedProfile = null;

    async function init() {
      if (firebase.auth().isSignInWithEmailLink(window.location.href)) {
        let email = window.localStorage.getItem("emailForSignIn");
        if (!email) email = window.prompt("請再次輸入您的 Email 以完成登入");

        try {
          const result = await firebase.auth().signInWithEmailLink(email, window.location.href);
          window.localStorage.removeItem("emailForSignIn");
          const idToken = await result.user.getIdToken();

          await fetch("/api/member/session-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken })
          });

          window.history.replaceState({}, document.title, "/member.html");
        } catch (e) {
          showLogin();
          setLoginMessage("登入失敗：" + e.message, true);
          return;
        }
      }

      const res = await fetch("/api/member/me");
      if (res.status === 401) {
        showLogin();
        return;
      }

      const data = await res.json();
      cachedProfile = data;
      showMember();
      renderProfile(data);
      await loadGroups();
    }

    function showLogin() {
      document.getElementById("loginSection").style.display = "flex";
      document.getElementById("memberSection").style.display = "none";
      document.getElementById("logout").style.display = "none";
    }

    function showMember() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("memberSection").style.display = "block";
      document.getElementById("logout").style.display = "inline-flex";
    }

    function setLoginMessage(message, isError = false) {
      const el = document.getElementById("loginMsg");
      el.textContent = message || "";
      el.className = isError ? "member-message error" : "member-message";
    }

    function getStatusBadge(status) {
      const map = {
        TRIAL: '<span class="badge badge-yellow">試用中</span>',
        ACTIVE: '<span class="badge badge-green">已啟用</span>',
        MANUAL_ACTIVE: '<span class="badge badge-blue">手動啟用</span>',
        INACTIVE: '<span class="badge badge-gray">未啟用</span>',
        PAYMENT_FAILED: '<span class="badge badge-red">付款失敗</span>'
      };
      return map[status] || '<span class="badge badge-gray">未設定</span>';
    }

    function renderProfile(data) {
      const used = Number(data.usage?.translationCount ?? 0);
      const quotaRaw = Number(data.subscription?.monthlyQuota ?? 0);
      const quotaText = quotaRaw > 0 ? quotaRaw : "無限制";
      const lineLinked = data.lineLinked ? "已綁定" : "未綁定";

      document.getElementById("profileStats").innerHTML = `
        <div class="stat-card">
          <div class="stat-label">LINE 狀態</div>
          <div class="stat-value c-green">${data.lineLinked ? "ON" : "OFF"}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">方案狀態</div>
          <div class="stat-value c-blue">${data.subscription?.status || "NONE"}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">本月用量</div>
          <div class="stat-value c-purple">${used}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">月額度</div>
          <div class="stat-value c-yellow">${quotaText}</div>
        </div>
      `;

      document.getElementById("profile").innerHTML = `
        <div class="member-info-card">
          <div class="member-info-label">登入 Email</div>
          <div class="member-info-value">${data.email || "-"}</div>
        </div>
        <div class="member-info-card">
          <div class="member-info-label">LINE 綁定</div>
          <div class="member-info-value">${lineLinked}</div>
        </div>
        <div class="member-info-card">
          <div class="member-info-label">方案資訊</div>
          <div class="member-info-value">${getStatusBadge(data.subscription?.status)} <span class="member-inline-note">${data.subscription?.plan || ""}</span></div>
        </div>
        <div class="member-info-card">
          <div class="member-info-label">本月翻譯次數</div>
          <div class="member-info-value">${used} / ${quotaText}</div>
        </div>
      `;
    }

    document.getElementById("sendLink").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        setLoginMessage("請先輸入 Email", true);
        return;
      }
