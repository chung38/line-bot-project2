<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>會員中心 | TransXAI</title>
<link rel="stylesheet" href="/css/style.css" />
</head>

<body class="member-v2-body">
  <div class="member-v2-app">
    <aside class="member-v2-sidebar">
      <a class="member-v2-brand" href="/" aria-label="TransXAI 首頁">
        <span class="member-v2-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M6 8.5C6 6.57 7.57 5 9.5 5h13C24.43 5 26 6.57 26 8.5v10C26 20.43 24.43 22 22.5 22H16l-5 5v-5H9.5C7.57 22 6 20.43 6 18.5v-10Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M11 13h10M11 17h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>
          <strong>TransXAI</strong>
          <small>會員中心</small>
        </span>
      </a>

      <nav class="member-v2-nav" aria-label="會員中心導覽">
        <a class="member-v2-nav-link active" href="#overview">
          <span>總覽</span>
        </a>
        <a class="member-v2-nav-link" href="#binding">
          <span>LINE 綁定</span>
        </a>
        <a class="member-v2-nav-link" href="#groups">
          <span>群組設定</span>
        </a>
      </nav>

      <div class="member-v2-side-bottom">
        <div class="member-v2-status">
          <span class="member-v2-status-dot"></span>
          系統正常運作中
        </div>
        <p>TransXAI Translation Service</p>
      </div>
    </aside>

    <main class="member-v2-main">
      <header class="member-v2-header">
        <div>
          <p class="member-v2-eyebrow">ACCOUNT SETTINGS</p>
          <h1>會員中心</h1>
        </div>

        <button id="logout" class="member-v2-logout" style="display:none;">
          登出
        </button>
      </header>

      <div class="member-v2-content">
        <!-- 未登入畫面 -->
        <section id="loginSection" class="member-v2-login-wrap" style="display:none;">
          <div class="member-v2-login-card">
            <div class="member-v2-login-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 7.5 12 13l8-5.5M5.5 5h13A1.5 1.5 0 0 1 20 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5v-11A1.5 1.5 0 0 1 5.5 5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </div>

            <p class="member-v2-eyebrow">PASSWORDLESS ACCESS</p>
            <h2>登入你的帳戶</h2>
            <p class="member-v2-login-desc">
              輸入 Email，我們會寄送安全登入連結至你的信箱。
            </p>

            <div class="member-v2-form">
              <label for="email">Email 地址</label>
              <input
                id="email"
                type="email"
                class="member-v2-input"
                placeholder="name@example.com"
                autocomplete="email"
              />
              <button id="sendLink" class="member-v2-primary-btn">
                寄送登入連結
                <span aria-hidden="true">→</span>
              </button>
              <p id="loginMsg" class="member-v2-message"></p>
            </div>
          </div>
        </section>

        <!-- 已登入畫面 -->
        <section id="memberSection" style="display:none;">
          <section id="overview" class="member-v2-section">
            <div class="member-v2-section-head">
              <div>
                <p class="member-v2-eyebrow">OVERVIEW</p>
                <h2>帳戶概覽</h2>
              </div>
            </div>

            <div id="profileStats" class="member-v2-metrics"></div>
            <div id="profile" class="member-v2-profile"></div>
          </section>

          <section id="binding" class="member-v2-section">
            <div class="member-v2-section-head">
              <div>
                <p class="member-v2-eyebrow">CONNECTION</p>
                <h2>LINE 帳號綁定</h2>
              </div>
            </div>

            <div class="member-v2-bind-row">
              <div>
                <h3>連結你的 LINE 帳號</h3>
                <p>
                  產生綁定碼後，請前往 LINE 官方帳號的一對一聊天室，傳送該綁定指令。
                </p>
              </div>
              <button id="genCode" class="member-v2-primary-btn member-v2-code-btn">
                產生綁定碼
              </button>
            </div>

            <div id="codeResult" class="member-v2-code-result"></div>
          </section>

          <section id="groups" class="member-v2-section">
            <div class="member-v2-section-head member-v2-group-heading">
              <div>
                <p class="member-v2-eyebrow">WORKSPACES</p>
                <h2>群組設定</h2>
              </div>
              <div id="groupsMeta"></div>
            </div>

            <div id="groups" class="member-v2-groups"></div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDuWgsAhMoDAgEOGCNPTsZ619-pMG9ElSg",
      authDomain: "transxai-82f12.firebaseapp.com"
    });

    const LANG_LABELS = {
      "zh-TW": "繁體中文",
      "en": "英文",
      "th": "泰文",
      "vi": "越南文",
      "id": "印尼文"
    };

    function escapeHtml(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showLogin() {
      document.getElementById("loginSection").style.display = "flex";
      document.getElementById("memberSection").style.display = "none";
      document.getElementById("logout").style.display = "none";
    }

    function showMember() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("memberSection").style.display = "block";
      document.getElementById("logout").style.display = "inline-flex";
    }

    function setLoginMessage(message = "", isError = false) {
      const target = document.getElementById("loginMsg");
      target.textContent = message;
      target.className = isError
        ? "member-v2-message member-v2-message-error"
        : "member-v2-message";
    }

    function subscriptionLabel(status) {
      const labels = {
        TRIAL: "試用中",
        ACTIVE: "使用中",
        MANUAL_ACTIVE: "手動啟用",
        INACTIVE: "未啟用",
        PAYMENT_FAILED: "付款失敗"
      };
      return labels[status] || "尚未設定";
    }

    function subscriptionClass(status) {
      const map = {
        TRIAL: "warning",
        ACTIVE: "success",
        MANUAL_ACTIVE: "info",
        INACTIVE: "neutral",
        PAYMENT_FAILED: "danger"
      };
      return map[status] || "neutral";
    }

    function renderProfile(data) {
      const isLinked = Boolean(data.lineLinked);
      const summary = data.summary || {};
      const groupCount = Number(summary.groupCount ?? 0);
      const used = Number(summary.usedTotal ?? 0);
      const quota = Number(summary.quotaTotal ?? 0);
      const quotaText = groupCount === 0 ? "—" : (quota > 0 ? quota.toLocaleString() : "無限制");
      const nearestExpiresAt = summary.nearestExpiresAt ? new Date(summary.nearestExpiresAt) : null;
      const expiresText = nearestExpiresAt
        ? nearestExpiresAt.toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" })
        : "—";

      document.getElementById("profileStats").innerHTML = `
        <article class="member-v2-metric">
          <p>LINE 連線</p>
          <strong>${isLinked ? "已綁定" : "未綁定"}</strong>
          <span class="member-v2-metric-note ${isLinked ? "positive" : ""}">
            <i></i>${isLinked ? "帳號已連結" : "等待綁定"}
          </span>
        </article>

        <article class="member-v2-metric">
          <p>管理群組數</p>
          <strong>${groupCount}</strong>
          <span class="member-v2-metric-note">各群組期限與額度各自獨立</span>
        </article>

        <article class="member-v2-metric">
          <p>本月翻譯（全部群組）</p>
          <strong>${used.toLocaleString()}</strong>
          <span class="member-v2-metric-note">已使用次數加總</span>
        </article>

        <article class="member-v2-metric">
          <p>最近到期</p>
          <strong>${expiresText}</strong>
          <span class="member-v2-metric-note">詳見下方各群組期限</span>
        </article>
      `;

      document.getElementById("profile").innerHTML = `
        <div class="member-v2-detail-row">
          <span>Email</span>
          <strong>${escapeHtml(data.email || "—")}</strong>
        </div>
        <div class="member-v2-detail-row">
          <span>LINE 狀態</span>
          <strong>
            <span class="member-v2-status-badge ${isLinked ? "success" : "neutral"}">
              ${isLinked ? "已綁定" : "未綁定"}
            </span>
          </strong>
        </div>
        <div class="member-v2-detail-row">
          <span>管理群組數</span>
          <strong>${groupCount}</strong>
        </div>
        <div class="member-v2-detail-row">
          <span>本月使用量（全部群組加總）</span>
          <strong>${used.toLocaleString()} / ${quotaText}</strong>
        </div>
      `;
    }

    async function init() {
      if (firebase.auth().isSignInWithEmailLink(window.location.href)) {
        let email = window.localStorage.getItem("emailForSignIn");

        if (!email) {
          email = window.prompt("請再次輸入您的 Email 以完成登入");
        }

        if (!email) {
          showLogin();
          setLoginMessage("需要 Email 才能完成登入。", true);
          return;
        }

        try {
          const result = await firebase.auth().signInWithEmailLink(email, window.location.href);
          window.localStorage.removeItem("emailForSignIn");

          const idToken = await result.user.getIdToken();

          const response = await fetch("/api/member/session-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken })
          });

          if (!response.ok) {
            throw new Error("伺服器登入驗證失敗");
          }

          window.history.replaceState({}, document.title, "/member.html");
        } catch (error) {
          showLogin();
          setLoginMessage("登入失敗：" + error.message, true);
          return;
        }
      }

      try {
        const response = await fetch("/api/member/me");

        if (response.status === 401) {
          showLogin();
          return;
        }

        if (!response.ok) {
          throw new Error("無法讀取會員資料");
        }

        const data = await response.json();
        showMember();
        renderProfile(data);
        await loadGroups();
      } catch (error) {
        showLogin();
        setLoginMessage("系統暫時無法連線，請稍後再試。", true);
      }
    }

    document.getElementById("sendLink").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        setLoginMessage("請輸入 Email 地址。", true);
        return;
      }

      try {
        await firebase.auth().sendSignInLinkToEmail(email, {
          url: window.location.origin + "/member.html",
          handleCodeInApp: true
        });

        window.localStorage.setItem("emailForSignIn", email);
        setLoginMessage("登入連結已寄出，請查看你的信箱與垃圾郵件匣。");
      } catch (error) {
        setLoginMessage("寄送失敗：" + error.message, true);
      }
    });

    document.getElementById("email").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        document.getElementById("sendLink").click();
      }
    });

    document.getElementById("genCode").addEventListener("click", async () => {
      const button = document.getElementById("genCode");
      const resultBox = document.getElementById("codeResult");

      button.disabled = true;
      button.textContent = "產生中...";

      try {
        const response = await fetch("/api/member/line-link-code", {
          method: "POST"
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "無法產生綁定碼");
        }

        const instruction = String(data.instruction || "");
        const bindingCode = instruction.replace(/^.*綁定\s*/i, "").trim();

        resultBox.className = "member-v2-code-result show";
        resultBox.innerHTML = `
          <div class="member-v2-code-result-head">
            <div>
              <p>請在 LINE 官方帳號私訊傳送</p>
              <strong>綁定指令</strong>
            </div>
            <button class="member-v2-copy-btn" onclick="copyBindingCode('${escapeHtml(bindingCode)}')">
              複製
            </button>
          </div>
          <div class="member-v2-command">${escapeHtml(instruction)}</div>
          <p>綁定碼有效時間為 10 分鐘。請勿在群組聊天室傳送。</p>
        `;
      } catch (error) {
        resultBox.className = "member-v2-code-result show error";
        resultBox.textContent = error.message || "產生綁定碼失敗";
      } finally {
        button.disabled = false;
        button.textContent = "產生綁定碼";
      }
    });

    async function copyBindingCode(code) {
      try {
        await navigator.clipboard.writeText(`綁定 ${code}`);
        const copyButton = document.querySelector(".member-v2-copy-btn");
        if (copyButton) {
          copyButton.textContent = "已複製";
          setTimeout(() => {
            copyButton.textContent = "複製";
          }, 1600);
        }
      } catch {
        window.prompt("請手動複製此綁定指令：", `綁定 ${code}`);
      }
    }

    function buildLangCheckboxes(gid, selectedLangs = []) {
      return Object.entries(LANG_LABELS).map(([code, label]) => `
        <label class="member-v2-lang-option">
          <input
            type="checkbox"
            class="lang-check-${gid}"
            value="${code}"
            ${selectedLangs.includes(code) ? "checked" : ""}
            onchange="updateGroup('${gid}')"
          />
          <span>${label}</span>
        </label>
      `).join("");
    }

    async function loadGroups() {
      const response = await fetch("/api/member/groups");

      if (!response.ok) {
        throw new Error("無法讀取群組資料");
      }

      const data = await response.json();
      const groups = data.groups || [];

      document.getElementById("groupsMeta").innerHTML = `
        <span class="member-v2-count">${groups.length} 個群組</span>
      `;

      if (groups.length === 0) {
        document.getElementById("groups").innerHTML = `
          <div class="member-v2-empty">
            <div class="member-v2-empty-symbol">—</div>
            <h3>尚未有可管理的群組</h3>
            <p>完成 LINE 帳號綁定後，使用該 LINE 帳號建立或綁定的群組會顯示在這裡。</p>
          </div>
        `;
        return;
      }

document.getElementById("groups").innerHTML = groups.map(group => `
  <article class="member-v2-group-card">
    <div class="member-v2-group-card-head">
      <div>
        <h3>${escapeHtml(group.groupName || group.gid)}</h3>
        <p>${escapeHtml(group.gid)}</p>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="member-v2-status-badge ${subscriptionClass(group.subscriptionStatus)}">
          ${escapeHtml(subscriptionLabel(group.subscriptionStatus))}
        </span>
        <button class="member-v2-primary-btn" style="padding:6px 14px; font-size:13px;" onclick="openCheckout('${group.gid}')">付款 / 續約</button>
      </div>
    </div>
    <div class="member-v2-setting-block">
      <div class="member-v2-setting-label">
        <span>翻譯語言</span>
        <small>可多選</small>
      </div>
      <div class="member-v2-language-list">${buildLangCheckboxes(group.gid, group.langs)}</div>
    </div>
    <div class="member-v2-setting-block">
      <div class="member-v2-setting-label">
        <span>行業類別</span>
      </div>
      <select id="industry-${group.gid}" class="member-v2-select" onchange="updateGroup('${group.gid}')">
        <option value="" ${!group.industry ? "selected" : ""}>未選擇</option>
        ${(group.industryOptions || []).map(industry =>
          `<option value="${escapeHtml(industry)}" ${group.industry === industry ? "selected" : ""}>${escapeHtml(industry)}</option>`
        ).join("")}
      </select>
    </div>
    <div id="save-${group.gid}" class="member-v2-save-state"></div>
  </article>
`).join("");
    }
async function openCheckout(gid) {
  const plan = window.confirm("按「確定」選擇年繳 NT$3000，按「取消」選擇月繳 NT$300")
    ? "yearly" : "monthly";

  const response = await fetch("/api/member/checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ gid, plan })
  });
  const data = await response.json();
  if (!response.ok) {
    alert(data.error || "建立訂單失敗");
    return;
  }

  const form = document.createElement("form");
  form.method = "POST";
  form.action = data.mpgUrl;
  const fields = {
    MerchantID: data.merchantId,
    TradeInfo: data.tradeInfo,
    TradeSha: data.tradeSha,
    Version: data.version
  };
  Object.entries(fields).forEach(([key, value]) => {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
}
    async function updateGroup(gid) {
      const saveState = document.getElementById(`save_${gid}`);
      const checkboxes = document.querySelectorAll(`.lang-check-${gid}`);
      const langs = [...checkboxes]
        .filter((checkbox) => checkbox.checked)
        .map((checkbox) => checkbox.value);

      const industry = document.getElementById(`industry_${gid}`).value;

      saveState.className = "member-v2-save-state saving";
      saveState.textContent = "儲存中...";

      try {
        const response = await fetch(`/api/member/groups/${gid}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ langs, industry })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "更新失敗");
        }

        saveState.className = "member-v2-save-state saved";
        saveState.textContent = "已儲存";

        setTimeout(() => {
          if (saveState.textContent === "已儲存") {
            saveState.textContent = "";
            saveState.className = "member-v2-save-state";
          }
        }, 2200);
      } catch (error) {
        saveState.className = "member-v2-save-state failed";
        saveState.textContent = error.message || "儲存失敗";
      }
    }

    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/member/logout", { method: "POST" });
      window.location.reload();
    });

    document.querySelectorAll(".member-v2-nav-link").forEach((link) => {
      link.addEventListener("click", () => {
        document.querySelectorAll(".member-v2-nav-link").forEach((item) => {
          item.classList.remove("active");
        });
        link.classList.add("active");
      });
    });

    init();
  </script>
</body>
</html>
