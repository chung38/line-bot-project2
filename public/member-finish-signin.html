<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>登入中...</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <p id="status">登入處理中，請稍候...</p>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "__FIREBASE_WEB_API_KEY__",
      authDomain: "__FIREBASE_AUTH_DOMAIN__"
    });

    (async () => {
      const status = document.getElementById('status');
      if (!firebase.auth().isSignInWithEmailLink(window.location.href)) {
        status.innerText = '無效的登入連結。';
        return;
      }

      let email = window.localStorage.getItem('emailForSignIn');
      if (!email) email = window.prompt('請再次輸入您的 Email 以完成登入');

      try {
        const result = await firebase.auth().signInWithEmailLink(email, window.location.href);
        window.localStorage.removeItem('emailForSignIn');

        const idToken = await result.user.getIdToken();

        const res = await fetch('/api/member/session-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });

        if (res.ok) {
          window.location.href = '/member.html';
        } else {
          status.innerText = '登入失敗，請重新嘗試。';
        }
      } catch (e) {
        status.innerText = '登入失敗：' + e.message;
      }
    })();
  </script>
</body>
</html>
